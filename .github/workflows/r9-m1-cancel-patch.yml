name: R9 M1 cancellation patch

on:
  push:
    branches: [primitives_redesign]
    paths:
      - .github/workflows/r9-m1-cancel-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: primitives_redesign
      - name: Apply record-keyed M1 cancellation
        shell: bash
        run: |
          echo '' | base64 -d | python3
          git diff --check
          git config user.name 'ESPressio Work Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add src/ESPressio_RadioAdapterM1.hpp src/ESPressio_RadioAdapterLowerTransport.hpp
          git commit -m 'Release M1 attempts by Adapter record'
          git push origin HEAD:primitives_redesign

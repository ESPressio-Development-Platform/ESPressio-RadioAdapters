name: RadioAdapters ingress contracts

on:
  push:
    branches:
      - primitives_redesign
  pull_request:

jobs:
  ingress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: RadioAdapters
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Adapters
          ref: primitives_redesign
          path: Adapters
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Primitive
          ref: primitives_redesign
          path: Primitive
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Radio
          ref: primitives_redesign
          path: Radio
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Event
          ref: primitives_redesign
          path: Event
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: primitives_redesign
          path: System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Task
          ref: primitives_redesign
          path: Task
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Threads
          ref: primitives_redesign
          path: Threads
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Timing
          ref: primitives_redesign
          path: Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Serializable
          ref: primitives_redesign
          path: Serializable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: primitives_redesign
          path: Units
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: primitives_redesign
          path: Observable
      - name: Compile frozen binding and direct-Radio ingress contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IRadioAdapters/src -IAdapters/src -IPrimitive/src -IRadio/src -IEvent/src -ISystem/src -ITask/src -IThreads/src -ITiming/src -ISerializable/src -IUnits/src -IObservable/src
          RadioAdapters/tests/radio_adapter_ingress_test.cpp
          -o radio_adapter_ingress_test
      - name: Run frozen binding and direct-Radio ingress contract
        run: ./radio_adapter_ingress_test
      - name: Compile direct-Radio exact M1 ingress integration contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IRadioAdapters/src -IAdapters/src -IPrimitive/src -IRadio/src -IEvent/src -ISystem/src -ITask/src -IThreads/src -ITiming/src -ISerializable/src -IUnits/src -IObservable/src
          RadioAdapters/tests/radio_adapter_m1_ingress_integration_test.cpp
          -o radio_adapter_m1_ingress_integration_test
      - name: Run direct-Radio exact M1 ingress integration contract
        run: ./radio_adapter_m1_ingress_integration_test

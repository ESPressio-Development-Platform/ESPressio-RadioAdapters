name: RadioAdapters ingress contracts

on:
  push:
    branches:
      - primitives_redesign
  pull_request:

jobs:
  ingress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: RadioAdapters
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Adapters
          ref: primitives_redesign
          path: Adapters
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Primitive
          ref: primitives_redesign
          path: Primitive
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Radio
          ref: primitives_redesign
          path: Radio
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: primitives_redesign
          path: System
      - name: Compile frozen binding and direct-Radio ingress contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IRadioAdapters/src -IAdapters/src -IPrimitive/src -IRadio/src -ISystem/src
          RadioAdapters/tests/radio_adapter_ingress_test.cpp
          -o radio_adapter_ingress_test
      - name: Run frozen binding and direct-Radio ingress contract
        run: ./radio_adapter_ingress_test

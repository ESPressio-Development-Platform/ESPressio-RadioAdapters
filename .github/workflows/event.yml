name: RadioAdapters Event direct-Radio contracts

on:
  push:
    branches:
      - primitives_redesign
  pull_request:

jobs:
  event-radio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: RadioAdapters
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Adapters
          ref: primitives_redesign
          path: Adapters
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Primitive
          ref: primitives_redesign
          path: Primitive
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Radio
          ref: primitives_redesign
          path: Radio
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Event
          ref: primitives_redesign
          path: Event
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: primitives_redesign
          path: System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Task
          ref: primitives_redesign
          path: Task
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Threads
          ref: primitives_redesign
          path: Threads
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Timing
          ref: primitives_redesign
          path: Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Serializable
          ref: primitives_redesign
          path: Serializable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: primitives_redesign
          path: Units
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: primitives_redesign
          path: Observable
      - name: Build Event direct-Radio A2 contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IRadioAdapters/src -IAdapters/src -IPrimitive/src -IRadio/src -IEvent/src
          -ISystem/src -ITask/src -ITask/tests -IThreads/src -ITiming/src -ITiming/tests/stubs
          -ISerializable/src -IUnits/src -IObservable/src
          RadioAdapters/tests/event_radio_adapter_contract_test.cpp
          -o event_radio_adapter_contract_test -pthread
      - name: Run Event direct-Radio A2 contract
        run: ./event_radio_adapter_contract_test
      - name: Build Event destination-admission policy contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IRadioAdapters/src -IAdapters/src -IPrimitive/src -IRadio/src -IEvent/src
          -ISystem/src -ITask/src -ITask/tests -IThreads/src -ITiming/src -ITiming/tests/stubs
          -ISerializable/src -IUnits/src -IObservable/src
          RadioAdapters/tests/event_radio_adapter_policy_test.cpp
          -o event_radio_adapter_policy_test -pthread
      - name: Run Event destination-admission policy contract
        run: ./event_radio_adapter_policy_test

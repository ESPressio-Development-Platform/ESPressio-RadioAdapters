name: RadioAdapters State direct-Radio contracts

on:
  push:
    branches: [primitives_redesign]
  pull_request:

jobs:
  state-radio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: RadioAdapters}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Adapters, ref: primitives_redesign, path: Adapters}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Primitive, ref: primitives_redesign, path: Primitive}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Radio, ref: primitives_redesign, path: Radio}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-System, ref: primitives_redesign, path: System}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-State, ref: primitives_redesign, path: State}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Persistence, ref: primitives_redesign, path: Persistence}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Task, ref: primitives_redesign, path: Task}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Threads, ref: primitives_redesign, path: Threads}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Timing, ref: primitives_redesign, path: Timing}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Serializable, ref: primitives_redesign, path: Serializable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Units, ref: primitives_redesign, path: Units}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Observable, ref: primitives_redesign, path: Observable}
      - name: Compile State outbound direct-Radio contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IRadioAdapters/src -IAdapters/src -IPrimitive/src -IRadio/src -ISystem/src -IState/src
          -IPersistence/src -ITask/src -ITask/tests -IThreads/src -ITiming/src -ITiming/tests/stubs
          -ISerializable/src -IUnits/src -IObservable/src
          RadioAdapters/tests/state_radio_adapter_outbound_test.cpp
          -o state_radio_adapter_outbound_test -pthread
      - name: Run State outbound direct-Radio contract
        run: ./state_radio_adapter_outbound_test
      - name: Compile State inbound direct-Radio contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IRadioAdapters/src -IAdapters/src -IPrimitive/src -IRadio/src -ISystem/src -IState/src
          -IPersistence/src -ITask/src -ITask/tests -IThreads/src -ITiming/src -ITiming/tests/stubs
          -ISerializable/src -IUnits/src -IObservable/src
          RadioAdapters/tests/state_radio_adapter_inbound_test.cpp
          -o state_radio_adapter_inbound_test -pthread
      - name: Run State inbound direct-Radio contract
        run: ./state_radio_adapter_inbound_test

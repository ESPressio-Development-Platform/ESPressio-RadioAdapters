name: RadioAdapters exact M1 contracts

on:
  push:
    branches:
      - primitives_redesign
  pull_request:

jobs:
  m1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: RadioAdapters
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Adapters
          ref: primitives_redesign
          path: Adapters
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Primitive
          ref: primitives_redesign
          path: Primitive
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Radio
          ref: primitives_redesign
          path: Radio
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: primitives_redesign
          path: System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Task
          ref: primitives_redesign
          path: Task
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Timing
          ref: primitives_redesign
          path: Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: primitives_redesign
          path: Units
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: primitives_redesign
          path: Observable
      - name: Compile bounded exact-M1 controller
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IRadioAdapters/src -IAdapters/src -IPrimitive/src -IRadio/src -ISystem/src -ITask/src -ITiming/src -IUnits/src -IObservable/src
          RadioAdapters/tests/radio_adapter_m1_test.cpp
          -o radio_adapter_m1_test
      - name: Run bounded exact-M1 controller
        run: ./radio_adapter_m1_test
